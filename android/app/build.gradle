plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.forge.app"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.0.9"
    }

    signingConfigs {
        release {
            storeFile file('../forge-release.jks')
            storePassword project.hasProperty('RELEASE_STORE_PASSWORD') ? RELEASE_STORE_PASSWORD : 'android'
            keyAlias project.hasProperty('RELEASE_KEY_ALIAS') ? RELEASE_KEY_ALIAS : 'key0'
            keyPassword project.hasProperty('RELEASE_KEY_PASSWORD') ? RELEASE_KEY_PASSWORD : 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register("generateReleaseKeystore") {
    doLast {
        def keystoreFile = file("../forge-release.jks")
        if (keystoreFile.exists()) {
            keystoreFile.delete()
        }
        sun.security.tools.keytool.Main.main([
            "-genkey", "-v",
            "-keystore", keystoreFile.absolutePath,
            "-alias", "key0",
            "-keyalg", "RSA",
            "-keysize", "2048",
            "-validity", "10000",
            "-storepass", "android",
            "-keypass", "android",
            "-dname", "CN=Forge, O=Forge, C=US"
        ] as String[])
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
