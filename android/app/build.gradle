plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// Firebase project for Google sign-in and sync (android/firebase.properties). Without it
// the build still works; sync just stays hidden.
def firebase = new Properties()
def firebaseFile = rootProject.file('firebase.properties')
if (firebaseFile.exists()) firebaseFile.withInputStream { firebase.load(it) }

android {
    namespace 'com.forge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.forge.app"
        minSdk 24
        targetSdk 34
        versionCode 35
        versionName "2.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${firebase.getProperty('projectId', '')}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${firebase.getProperty('apiKey', '')}\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"${firebase.getProperty('appId', '')}\""
        buildConfigField "String", "FIREBASE_WEB_CLIENT_ID", "\"${firebase.getProperty('webClientId', '')}\""
    }

    // Release builds are signed with Forge's permanent key, kept off GitHub. Without the key
    // (as in CI) the release APK comes out unsigned and is signed afterwards.
    def releaseKey = file('../forge-release.jks')
    signingConfigs {
        if (releaseKey.exists()) {
            release {
                storeFile releaseKey
                storePassword project.hasProperty('RELEASE_STORE_PASSWORD') ? RELEASE_STORE_PASSWORD : ''
                keyAlias project.hasProperty('RELEASE_KEY_ALIAS') ? RELEASE_KEY_ALIAS : 'forge'
                keyPassword project.hasProperty('RELEASE_KEY_PASSWORD') ? RELEASE_KEY_PASSWORD : ''
            }
        }
    }

    buildTypes {
        release {
            if (releaseKey.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // OkHttp (for Gemini API)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // On-device tests
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Photo picker and camera results from dialogs
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Fuel: barcode scanning through Google Play services (no camera permission needed)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // Wake-up challenge: camera preview and on-device rep counting
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'

    // Google sign-in and sync between devices
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Unit tests for the counting and scoring logic
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
