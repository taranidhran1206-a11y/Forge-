name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v2.0.2-signed.apk
        ls -la android/Forge-v2.0.2-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v2.0.2-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.2
        name: "Forge v2.0.2 — Rize Tracker & Bug Fixes"
        body: |
          ## Forge v2.0.2 — Rize Tracker & Bug Fixes

          ### Fixes
          - **Rize Tracker**: Fixed time tracking not starting — eliminated race condition between button tap and DB insert, timer now starts reliably from observer
          - **Rize Tracker**: Added immediate visual feedback on tap, error handling for DB operations
          - **Widgets**: Fixed "Couldn't add widget" — all 4 providers target exported SplashActivity
          - **Widget ProgressBar**: Proper layer-list drawable with clip wrapper
          - **Boot Logo**: Fixed splash logo scaling (120dp with ic_launcher)
          - **XP Progress Bar**: Fixed fill rendering with proper layer-list

          ### Changes
          - **AI Coach**: Reverted to terminal style with Hercules branding
          - **Gamification**: Rank-up toast, global rank % display
          - **Time Tracker**: Active indicator dot, immediate button state change

          ### Install
          1. Download `Forge-v2.0.2-signed.apk`
          2. Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install

          Built by Tarani. Forged in discipline.
        files: android/Forge-v2.0.2-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
