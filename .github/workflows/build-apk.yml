name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Copy latest index.html to assets
      run: cp index.html android/app/src/main/assets/index.html

    - name: Generate Gradle Wrapper
      run: |
        # Generate wrapper from a clean directory to avoid AGP/Gradle version conflict
        mkdir -p /tmp/wrapper-gen
        cd /tmp/wrapper-gen
        gradle wrapper --gradle-version 9.5
        cp gradlew gradlew.bat $GITHUB_WORKSPACE/android/
        cp -r gradle $GITHUB_WORKSPACE/android/
        chmod +x $GITHUB_WORKSPACE/android/gradlew

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Sign APK
      run: |
        cd android
        # Generate signing key
        keytool -genkey -v -keystore forge-release.keystore \
          -alias forge -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass forgeapp -keypass forgeapp \
          -dname "CN=Forge App, OU=Forge, O=Forge, L=KL, ST=KL, C=MY"

        # Find the APK
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"

        # Find apksigner
        APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name "apksigner" | sort -V | tail -1)
        echo "Using apksigner: $APKSIGNER"

        $APKSIGNER sign \
          --ks forge-release.keystore \
          --ks-pass pass:forgeapp \
          --key-pass pass:forgeapp \
          --out Forge-v1.0.3-signed.apk \
          "$APK_PATH"

        ls -la Forge-v1.0.3-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v1.0.3-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.3
        name: "Forge v1.0.3 — Bug Fixes & AI Coach"
        body: |
          ## Forge v1.0.3

          Bug fixes and improvements for the Discipline Companion.

          ### What's Fixed
          - **AI Coach & Reflection now work** — fixed invalid Gemini model (was using non-existent model name)
          - **Font loading fixed** — CSS `@import` order corrected for reliable font rendering on all devices
          - **Native notifications** — ForgeBridge integration unified across builds

          ### Features
          - **Rize-style Focus Tracking** with 7 categories
          - **Push Notifications** — session start/end, break reminders, distraction detection
          - **AI Coach** powered by Gemini 3.5 Flash
          - **Auto Distraction Detection** — knows when you leave and nudges you back
          - **XP & Leveling** gamification system
          - **Daily Labors** task management with streak tracking
          - **Time Audit** breakdown of where your hours go
          - **Full offline support** — works without internet (except AI Coach)

          ### Install
          1. Download `Forge-v1.0.3-signed.apk`
          2. On your phone, go to Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install

          Built by Tarani. Forged in discipline.
        files: android/Forge-v1.0.3-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
