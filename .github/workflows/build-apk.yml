name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Copy latest index.html to assets
      run: cp index.html android/app/src/main/assets/index.html

    - name: Generate Gradle Wrapper
      run: |
        mkdir -p /tmp/wrapper-gen
        cd /tmp/wrapper-gen
        touch settings.gradle
        gradle wrapper --gradle-version 9.5
        cp gradlew gradlew.bat $GITHUB_WORKSPACE/android/
        cp -r gradle $GITHUB_WORKSPACE/android/
        chmod +x $GITHUB_WORKSPACE/android/gradlew

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v1.15.0-signed.apk
        ls -la android/Forge-v1.15.0-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v1.15.0-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.15.0
        name: "Forge v1.15.0 — Rank System + All Features"
        body: |
          ## Forge v1.15.0

          Full gamification rank system added — climb from Iron to Titan.

          ### What's New in v1.15.0
          - **Rank System** — Iron → Bronze → Silver → Gold → Platinum → Diamond → Titan
          - **Rank Pill in Header** — colored rank badge replaces numeric level pill
          - **Rank-Up Toasts** — distinct notifications for rank promotions vs level-ups
          - **Rank Display Everywhere** — Today tab, Progress tab, and header all show current rank

          ### Rank Tiers
          | Rank | Levels | Color |
          |------|--------|-------|
          | Iron | 1-2 | Grey |
          | Bronze | 3-4 | Brown |
          | Silver | 5-6 | Light Blue |
          | Gold | 7-8 | Yellow |
          | Platinum | 9-10 | Cyan |
          | Diamond | 11-12 | Purple |
          | Titan | 13 | Rainbow Gradient |

          ### All Features
          - Focus Timer with auto-detect (no category buttons)
          - AI Coach powered by Gemini 3.8 Flash (hardcoded, works instantly)
          - Voice Dictation for Coach
          - Chat-Based Coach UI with suggestion chips
          - Rize-style Distraction Detection with overlay nudge
          - XP, Leveling & Rank gamification system
          - Daily Labors — fully editable task management
          - Time Audit breakdown
          - Progress tracking with streaks
          - Journal & Reflection
          - Full offline support (except AI Coach)

          ### Install
          1. Download `Forge-v1.15.0-signed.apk`
          2. Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install

          Built by Tarani. Forged in discipline.
        files: android/Forge-v1.15.0-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
