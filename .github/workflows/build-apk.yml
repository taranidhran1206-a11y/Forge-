name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v2.1.12-signed.apk
        ls -la android/Forge-v2.1.12-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v2.1.12-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.12
        name: "Forge v2.1.12 — Widget fix and mockup match"
        body: |
          ## Forge v2.1.12

          ### Widgets
          - Fixed the Today's Plan widget failing to load: its layout used a view type that home screen widgets do not allow
          - Today's Plan, Day Streak and Rank widgets rebuilt to the mockup, including the "All done. Nice work." state
          - The rank widget now updates as soon as XP changes

          ### Screens brought in line with the mockups
          - Tabs are now Today, Focus, Coach, Rank and Reflect, with the mockup's icons
          - Focus is its own screen: ring timer, nudge tracker, time by category
          - Today: logo in the header, Monday-first week strip, no extra top bar
          - Rank: filled badge, percent to next rank, ladder from your current rank
          - Plan and Reflect rebuilt in the new style; Plan opens from the Today screen
          - Text and spacing on every screen now scale on tablets

          ### Install
          1. Download `Forge-v2.1.12-signed.apk`
          2. If Android refuses to install over the old version, uninstall Forge first. Each build is signed with a new key, and uninstalling clears saved data
          3. Open the app once, then add the widgets again from the home screen
        files: android/Forge-v2.1.12-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
