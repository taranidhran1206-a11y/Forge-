name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Copy latest index.html to assets
      run: cp index.html android/app/src/main/assets/index.html

    - name: Generate Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Sign APK
      run: |
        cd android
        # Generate signing key
        keytool -genkey -v -keystore forge-release.keystore \
          -alias forge -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass forgeapp -keypass forgeapp \
          -dname "CN=Forge App, OU=Forge, O=Forge, L=KL, ST=KL, C=MY"

        # Find and sign APK
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

        # Find apksigner
        APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name "apksigner" | sort -V | tail -1)

        $APKSIGNER sign \
          --ks forge-release.keystore \
          --ks-pass pass:forgeapp \
          --key-pass pass:forgeapp \
          --out Forge-v1.0.0-signed.apk \
          "$APK_PATH"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v1.0.0-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "Forge v1.0.0 — Discipline Companion"
        body: |
          ## Forge v1.0.0 🪓

          Your discipline companion — now as an Android app.

          ### Features
          - **Rize-style Focus Tracking** with 7 categories (Deep Work, Learning, Admin, Exercise, Rest, Social Media, YouTube)
          - **Push Notifications** — session start/end, break reminders, distraction detection
          - **AI Coach** powered by Gemini 3.8 Flash — brutally honest, Goggins-style accountability
          - **Auto Distraction Detection** — knows when you leave and nudges you back
          - **XP & Leveling** gamification system
          - **Daily Labors** task management with streak tracking
          - **Time Audit** breakdown of where your hours go
          - **Full offline support** — works without internet (except AI Coach)

          ### Install
          1. Download `Forge-v1.0.0-signed.apk`
          2. On your phone, go to Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install

          Built by Tarani. Forged in discipline.
        files: android/Forge-v1.0.0-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
