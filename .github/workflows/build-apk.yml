name: Build Forge APK

# Builds and tests every push to main and to feature branches. The release APK comes out
# unsigned: it is signed with Forge's permanent key outside GitHub, so every version can
# install over the last one without uninstalling.

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Unit tests
      run: |
        cd android
        ./gradlew testDebugUnitTest --no-daemon

    - name: Build release APK (unsigned)
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Align the APK
      run: |
        APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK"
        $ANDROID_HOME/build-tools/34.0.0/zipalign -p -f 4 "$APK" android/Forge-unsigned.apk
        $ANDROID_HOME/build-tools/34.0.0/zipalign -c -p 4 android/Forge-unsigned.apk
        ls -la android/Forge-unsigned.apk

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: android/app/build/reports/tests/
        if-no-files-found: ignore

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Forge-unsigned
        path: android/Forge-unsigned.apk
