name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v2.0.0-signed.apk
        ls -la android/Forge-v2.0.0-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v2.0.0-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        name: "Forge v2.0.0 — Full Native Kotlin Rebuild"
        body: |
          ## Forge v2.0.0 — Full Native Kotlin Rebuild

          Complete rebuild from WebView to full native Kotlin/Java Android app.

          ### Features
          - Rize-style time tracker with manual category selection
          - XP/gamification system with animated toasts
          - Rank ladder (Iron → Legend)
          - Tasks grouped by time of day (Morning/Afternoon/Evening)
          - Weekly day dots streak tracker
          - Home screen widgets (Today's Plan, Rank, Streak)
          - AI Coach powered by Gemini API
          - Focus timer (Pomodoro) with ring visualization
          - Battle Plan terminal-style planning
          - Reflection/Journal with rotating prompts
          - Terminal/hacker design theme
          - Room database persistence, MVVM architecture

          ### Install
          1. Download `Forge-v2.0.0-signed.apk`
          2. Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install

          Built by Tarani. Forged in discipline.
        files: android/Forge-v2.0.0-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
