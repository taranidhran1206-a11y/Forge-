name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v2.0.4-signed.apk
        ls -la android/Forge-v2.0.4-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v2.0.4-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.4
        name: "Forge v2.0.4 — Critique AI Style"
        body: |
          ## Forge v2.0.4 — Critique AI Style Update

          ### Widget Redesign (matching Critique AI video)
          - **Today's Plan Widget**: "TODAY'S PLAN" header, date, green "X/Y" count badge, progress bar at top, circle checkmarks on left, "All done - nice work" message
          - **Day Streak Widget**: Simple centered design — fire emoji, large streak number, "DAY STREAK" label, "X/Y today" progress
          - **Rank Widget**: Rank emoji, rank name, formatted XP, progress bar

          ### In-App Updates
          - **XP Toast**: Green pill style "+50 XP Task Completed" notifications (matching video)
          - **Task Cards**: Green circle checks for done, pending circles for incomplete, descriptions below task names, chevron arrows
          - **Section Headers**: Clean "MORNING", "FOCUS", "STREAK" style (no monospace terminal)
          - **Day Dots**: Green filled for completed days, orange for today
          - **Rank Ladder Screen**: Large rank badge, LEVEL label, Current XP + Global Rank %, progress bar, Global Leaderboard + Friends cards

          ### Rank System Expanded
          - Added MYTHIC (15k XP), APEX (25k XP) ranks
          - LEGEND now at 50k XP
          - Updated global rank percentages

          ### Install
          1. Download `Forge-v2.0.4-signed.apk`
          2. Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install
          4. Long-press home screen > Widgets > Forge

          Built by Tarani. Forged in discipline.
        files: android/Forge-v2.0.4-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
