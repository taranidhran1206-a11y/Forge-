name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Copy latest index.html to assets
      run: cp index.html android/app/src/main/assets/index.html

    - name: Generate Gradle Wrapper
      run: |
        mkdir -p /tmp/wrapper-gen
        cd /tmp/wrapper-gen
        touch settings.gradle
        gradle wrapper --gradle-version 9.5
        cp gradlew gradlew.bat $GITHUB_WORKSPACE/android/
        cp -r gradle $GITHUB_WORKSPACE/android/
        chmod +x $GITHUB_WORKSPACE/android/gradlew

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v1.0.5-signed.apk
        ls -la android/Forge-v1.0.5-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v1.0.5-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.5
        name: "Forge v1.0.5 — Editable Labors + Coach Animations"
        body: |
          ## Forge v1.0.5

          New features and improved app icon.

          ### What's New
          - **Editable Labors** — tap the edit icon to rename, change time, or change emoji for any labor
          - **Add Custom Labors** — "+" button at the bottom to create your own tasks
          - **Delete Labors** — remove any labor you don't need
          - **Today's Date** — labors view shows the current date
          - **AI Coach Star Animation** — sparkle/star animation while the coach processes your message
          - **Cleaner App Icon** — bold red "F" on dark blue background

          ### All Features
          - **Rize-style Focus Tracking** with 7 categories
          - **Push Notifications** — session start/end, break reminders, distraction detection
          - **AI Coach** powered by Gemini 3.5 Flash with animated processing
          - **Auto Distraction Detection** — knows when you leave and nudges you back
          - **XP & Leveling** gamification system
          - **Daily Labors** — fully editable task management with streak tracking
          - **Time Audit** breakdown of where your hours go
          - **Full offline support** — works without internet (except AI Coach)

          ### Install
          1. Download `Forge-v1.0.5-signed.apk`
          2. On your phone, go to Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install

          Built by Tarani. Forged in discipline.
        files: android/Forge-v1.0.5-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
