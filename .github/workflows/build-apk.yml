name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v2.1.14-signed.apk
        ls -la android/Forge-v2.1.14-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v2.1.14-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.14
        name: "Forge v2.1.14 — Crash fixes, working coach, tested on an emulator"
        body: |
          ## Forge v2.1.14

          This is the first build that was run and checked on an Android emulator before release.

          ### Fixed
          - Ticking a labor no longer crashes the app
          - Sending a coach message no longer crashes the app
          - Coach is now connected to Gemini and answers using your real labors, streak and focus time
          - Reflections get a coach insight after you save them
          - Unticking a labor updates the day's stats

          ### Widgets
          - Tap a labor on the Today's Plan widget to tick or untick it without opening the app
          - Widgets were inflated on a device the way a launcher does, and all three load

          ### Checked on the emulator
          - Tick a labor, start a focus session, leave the app and receive a nudge, coach reply, save a reflection, widget tick, landscape

          ### Install
          1. Download `Forge-v2.1.14-signed.apk`
          2. If Android refuses to install over the old version, uninstall Forge first. Each build is signed with a new key, and uninstalling clears saved data
          3. Open the app once, then add the widgets again from the home screen
        files: android/Forge-v2.1.14-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
