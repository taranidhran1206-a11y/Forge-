name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v2.0.3-signed.apk
        ls -la android/Forge-v2.0.3-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v2.0.3-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.3
        name: "Forge v2.0.3 — Widget Redesign"
        body: |
          ## Forge v2.0.3 — Widget Redesign

          ### New Widget Design (Upwell-inspired)
          - **Today's Plan**: Clean card with priority bars, circle checkboxes, count badge, "All done — nice work" green message when complete, progress bar
          - **Weekly Streak Grid**: Emoji habit rows (Focus, Labors, Journal, Rize), M-T-W-T-F-S-S columns, green checkmarks, date range header, streak count footer
          - **Rank Widget**: Rank emoji, rank name with color, formatted XP, progress bar to next rank
          - **Mood Widget**: Warm gradient background, 5-emoji scale, mood label pill
          - **All Widgets**: Dark glass rounded cards (24dp corners), proper scaling for phones and tablets, resize support

          ### Technical
          - All widget backgrounds use consistent dark glass aesthetic
          - WidgetHelper now computes weekly streak grid data (focus, labors, journal, rize per day)
          - Proper layer-list progress drawables for all ProgressBars
          - Widget info XMLs have min/max resize bounds for phone + tablet

          ### Install
          1. Download `Forge-v2.0.3-signed.apk`
          2. Settings > Security > Enable "Install from unknown sources"
          3. Open the APK and install
          4. Long-press home screen > Widgets > Forge to add widgets

          Built by Tarani. Forged in discipline.
        files: android/Forge-v2.0.3-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
