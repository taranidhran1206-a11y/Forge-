name: Build Forge APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" || true

    - name: Generate signing keystore
      run: |
        keytool -genkey -v \
          -keystore android/forge-release.jks \
          -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Forge, O=Forge, C=US"

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Prepare APK
      run: |
        APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "Found APK: $APK_PATH"
        cp "$APK_PATH" android/Forge-v2.1.11-signed.apk
        ls -la android/Forge-v2.1.11-signed.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Forge-APK
        path: android/Forge-v2.1.11-signed.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.11
        name: "Forge v2.1.11 — Redesign and nudge tracker"
        body: |
          ## Forge v2.1.11

          ### Redesign
          - New look on every screen: Today, Rank, Coach, Plan and Reflect
          - Labors grouped by morning, afternoon and evening, with the next one highlighted
          - Transparent axe logo, no coloured tile behind it
          - Rank ladder with the real XP thresholds

          ### Scales to any screen
          - Sizes adapt on phones and tablets
          - Portrait and landscape both supported; landscape uses a side rail and two columns

          ### Focus session with nudge tracker
          - Focus timer keeps running when you leave the app
          - Leave Forge with the screen on for 15 seconds and you get a nudge notification
          - Tracker shows nudges, drifts, time away and a focus score for the day
          - Deep work labors get a one-tap Focus button

          ### Fixes
          - Yesterday's labors now carry into the new day, so the plan and widgets are not empty
          - Widgets start a new day unchecked and list open labors first

          ### Install
          1. Download `Forge-v2.1.11-signed.apk`
          2. If Android refuses to install over the old version, uninstall Forge first. Each build is signed with a new key, and uninstalling clears saved data
          3. Allow notifications when asked, so nudges can reach you
          4. Remove and re-add the home screen widgets
        files: android/Forge-v2.1.11-signed.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
