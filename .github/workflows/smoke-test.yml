name: Smoke test on emulator

on:
  push:
    branches: ['fix/**', 'smoke/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: List usable Gemini models
      run: python3 scripts/probe_models.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build the previous release for the upgrade test
      run: |
        git worktree add /tmp/old v2.1.14
        cd /tmp/old/android
        ./gradlew assembleDebug --no-daemon -q
        cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/old-debug.apk"

    - name: Build debug APK and tests
      run: |
        cd android
        ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

    - name: Run the app on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash scripts/smoke.sh

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-out
        path: smoke-out

    - name: Publish results to the smoke-results branch
      if: always()
      run: |
        cd smoke-out
        rm -f ui.xml
        git init -q -b smoke-results
        git config user.name "forge-smoke"
        git config user.email "forge-smoke@users.noreply.github.com"
        git add -A
        git commit -q -m "Smoke results for $GITHUB_SHA"
        git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoke-results
