name: Smoke test on emulator

on:
  push:
    branches: ['fix/**', 'smoke/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - name: List usable Gemini models
      run: python3 scripts/probe_models.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build the previous release for the upgrade test
      run: |
        git worktree add --detach /tmp/old fdeaa6dd6c69b466d1469cf9c738c5fbb7fd2c6c
        cd /tmp/old/android
        ./gradlew assembleDebug --no-daemon -q
        cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/old-debug.apk"

    - name: Build debug APK and tests
      run: |
        cd android
        ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

    - name: Start the Firebase emulators for the sync test
      run: |
        npm install -g firebase-tools@13 > /tmp/firebase-install.log 2>&1 || tail -20 /tmp/firebase-install.log
        printf '{"emulators": {"auth": {"host": "0.0.0.0", "port": 9099}, "firestore": {"host": "0.0.0.0", "port": 8080}}}' > /tmp/firebase.json
        cd /tmp && nohup firebase emulators:start --only auth,firestore --project demo-forge --config /tmp/firebase.json > /tmp/firebase.log 2>&1 &
        for i in $(seq 1 60); do
          curl -s -o /dev/null localhost:8080 && curl -s -o /dev/null localhost:9099 && echo "emulators up" && break
          sleep 2
        done
        tail -5 /tmp/firebase.log

    - name: Run the app on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        script: bash scripts/smoke.sh

    - name: Keep the Firebase emulator log
      if: always()
      run: mkdir -p smoke-out && cp /tmp/firebase.log smoke-out/firebase.log 2>/dev/null || true

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-out
        path: smoke-out

    - name: Publish results to the smoke-results branch
      if: always()
      run: |
        cd smoke-out
        rm -f ui.xml
        git init -q -b smoke-results
        git config user.name "forge-smoke"
        git config user.email "forge-smoke@users.noreply.github.com"
        git add -A
        git commit -q -m "Smoke results for $GITHUB_SHA"
        git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoke-results
